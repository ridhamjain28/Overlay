<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Overlay Agent Mode mark: "pulsing ring" -->
  <defs>
    <linearGradient id="overlay-ring-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3123a"/>
      <stop offset="1" stop-color="#5c0016"/>
    </linearGradient>
    <radialGradient id="overlay-ring-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9ab0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9ab0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="300" rx="68" fill="url(#overlay-ring-tile)"/>
  <circle cx="150" cy="150" r="118" fill="url(#overlay-ring-glow)"/>
  <circle cx="150" cy="150" r="98" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="150" cy="150" r="72" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="8"/>
  <circle cx="150" cy="150" r="42" fill="#fff"/>
</svg>